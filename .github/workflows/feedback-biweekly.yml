name: feedback-biweekly
# 2주 1회 GitHub 반응/피드백 수집 — 별점·이슈·요구사항·에러 리포트
# 일정: 매월 1일 / 15일 10:00 (KST)  (UTC 01:00)
on:
  schedule:
    - cron: "0 1 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GitHub 피드백 수집
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python scripts/feedback_collect.py
